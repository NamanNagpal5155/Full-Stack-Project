services:
  - type: web
    name: moodify
    runtime: node
    buildCommand: npm install --prefix Backend && npm install --prefix Frontend && npm run build --prefix Frontend
    startCommand: npm start --prefix Backend
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: VITE_API_URL
        value: ""
